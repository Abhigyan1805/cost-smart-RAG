[project]
name = "costsmart-rag"
version = "0.1.0"
description = "Routed RAG agent: routes over (model x retrieval depth x reasoning strategy) with post-retrieval signals, measured against an exhaustive oracle."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "costsmart-rag" }]
dependencies = [
  "typer==0.12.5",
  "pyyaml==6.0.2",
  "httpx==0.27.2",
  "numpy==1.26.4",
  "scikit-learn==1.5.2",
  "pandas==2.2.3",
  "pyarrow==17.0.0",
]

[project.optional-dependencies]
dev = [
  "pytest==8.3.4",
  "ruff==0.6.9",
]

[project.scripts]
costsmart = "costsmart.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/costsmart"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.pytest.ini_options]
testpaths = ["tests"]
