# E2: escalation-threshold sweep (plan: confidence threshold vs P/R + cost).
# Varies the verify->escalate threshold; each setting is a separate sweep
# distinguished by prompt_version/config_hash for reproducibility.
name: E2-escalation-thresholds
routes: [L0, C0, C1, C2]
prompt_version: v1
n_queries: 50
seed: 1
escalation_thresholds: [0.3, 0.5, 0.7, 0.9]
metrics: [escalation_pr, regret]
stats: [bootstrap_ci]
